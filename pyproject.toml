[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-cxr"
version = "0.1.0"
description = "Abnormality-guided vision-language model for chest X-ray report generation"
requires-python = ">=3.10"
# Runtime dependencies deliberately live in requirements-stage1.txt and
# requirements-stage2.txt: the two stages pin incompatible torch/transformers
# versions and are installed into separate environments. Listing them here
# would imply one resolvable set, which does not exist.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]

# The evaluator core (classification metrics, AUROC/AUPRC, threshold
# calibration, bootstrap, BLEU/ROUGE, error analysis) needs only numpy, so it
# runs anywhere the test suite does. These extras are for the parts that do not.
eval-plots = ["matplotlib>=3.7"]

# Reference implementations for the metrics this repo deliberately does not
# reimplement. Without them those metrics are reported as unavailable with an
# install command -- never as a score of 0.
eval-generation = [
    "nltk>=3.9",
    "pycocoevalcap>=1.2",
    "bert-score>=0.3.13",
]

# Clinical metrics are deliberately NOT listed as installable extras.
#
# CheXbert, RadGraph, RadCliQ and RadFact are distributed as research code with
# model weights behind separate licences, not as versioned PyPI packages that
# resolve reproducibly. Writing a plausible-looking pin here would imply this
# project had installed and validated them; it has not. The adapters in
# training/evaluation/clinical.py raise MissingOptionalDependency naming the
# package, and NotImplementedError if the package is present but the adapter
# has not been wired and validated against published reference scores.
#
# See docs/evaluator_validation.md ("Những gì KHÔNG được kiểm chứng").

# The repo is not yet a src-layout package; modules are imported by path from
# the repo root. Declaring packages here would misrepresent that. This file
# exists for tooling configuration, not for distribution.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode prepends the rootdir, which is how the path-based imports in
# tests/conftest.py resolve model/ and model/lavis/ without executing
# model/lavis/__init__.py.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    # Vendored fork of Salesforce LAVIS. Reformatting it would make every
    # future upstream diff unreadable.
    "model/lavis",
    # Legacy MHCAC variants 8-11, kept for reference; only mhcac_12 is wired.
    "mhcac/mhcac_8.py",
    "mhcac/mhcac_9.py",
    "mhcac/mhcac_10.py",
    "mhcac/mhcac_11.py",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # FastAPI-style default-call pattern is not used here
    "UP038",  # isinstance tuple form is still faster on 3.10
]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap sys.path before importing repo modules, so imports cannot
# all sit at the top of the file.
"tests/*" = ["E402"]
"training/run_medgemma_qlora.py" = ["E402"]
"training/train_eval_figure9_llm_variants_200.py" = ["E402"]
# LAVIS registry population genuinely requires the star imports.
"pretraining/train.py" = ["F401", "F403"]
"pretraining/precompute_features.py" = ["F401", "F403"]
