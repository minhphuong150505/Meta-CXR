# P4 — P3 + view/indication/technique metadata (still no visual-primary emphasis).
prompt:
  version: P4_add_views
  visual_mode: qformer_guided
  normal_policy: compact_summary
  negative_policy: critical_only
  max_negative_findings: 4
  uncertainty_policy: explicit_possible
  evidence_priority:
    visual_primary: false
    structured_auxiliary: true
  context:
    include_views: true
    include_indication: true
    include_technique: true
    include_prior_flag: true
  temporal:
    forbid_comparison_without_prior: true
    target_policy: keep
  output:
    section: findings
    min_sentences: 1
    max_sentences: 4
