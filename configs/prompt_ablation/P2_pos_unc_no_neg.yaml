# P2 — positive + uncertain only, no negatives.
prompt:
  version: P2_pos_unc_no_neg
  visual_mode: qformer_guided
  normal_policy: no_structured_normal_statement
  negative_policy: none
  uncertainty_policy: explicit_possible
  evidence_priority:
    visual_primary: false
    structured_auxiliary: true
  context:
    include_views: false
    include_indication: false
    include_technique: false
    include_prior_flag: true
  temporal:
    forbid_comparison_without_prior: true
    target_policy: keep
  output:
    section: findings
    min_sentences: 1
    max_sentences: 4
