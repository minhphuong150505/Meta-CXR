# Legacy Kaggle integration is intentionally disabled.
#
# MIMIC-CXR and derivatives (including cleaned reports, split CSVs, features,
# predictions, and checkpoints trained on them) must not be published as a
# Kaggle Dataset or assigned an open-data licence such as CC0. This repository's
# supported full-data path is a credentialed local mirror or a private GCS
# bucket in the authorised GCP project.

policy:
  enabled: false
  storage: "private-gcs-only"
  canonical_data_uri: "gs://mimic-cxr-jpg-dataset-phuongnm"
  processed_prefix: "processed/full_allviews"
  reason: "MIMIC-CXR PhysioNet DUA: redistribution is prohibited"

datasets: {}
