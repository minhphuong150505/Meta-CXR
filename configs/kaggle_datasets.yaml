# Kaggle dataset config — sửa file này khi:
#   - Đổi slug dataset (vd. dùng dataset mới)
#   - Kaggle thay đổi cấu trúc mount (/kaggle/input/datasets/ → khác)
#   - Đổi tên file CSV pre-built hoặc các metadata CSV

datasets:
  images:
    # STALE for full-dataset runs: this slug is the p10-only downsized "lite" set.
    # Since 2026-07-20 images come from gs://mimic-cxr-jpg-dataset-phuongnm (571 GiB,
    # p10-p19) — that does not fit Kaggle disk, so Kaggle can only be used with a
    # subset. The metadata CSVs below live in the bucket as .csv.gz.
    slug: "mimic-cxr-jpg-lite"
    required_files:
      - "mimic-cxr-2.0.0-split.csv"
      - "mimic-cxr-2.0.0-chexpert.csv"
      - "mimic-cxr-2.0.0-metadata.csv"
  reports:
    slug: "mimic-cxr-reported"
    cleaned_csv_filename: "mimic_cxr_cleaned.csv"
    txt_glob: "files/**/s*.txt"
  processed:
    # Canonical copy lives at
    # gs://mimic-cxr-jpg-dataset-phuongnm/processed/full_allviews/ (built 2026-07-20).
    # This Kaggle slug is only a mirror; re-upload it if you train on Kaggle.
    slug: "mimic-cxr-full-processed"
    title: "MIMIC-CXR full p10-p19 Preprocessed (all views, train/val/test)"
    license: "CC0-1.0"
    required_files:
      - "train.csv"
      - "val.csv"
      - "test.csv"

# Thứ tự tìm mount point — path đầu tiên tồn tại sẽ được dùng.
mount_search_roots:
  - "/kaggle/input/datasets"
  - "/kaggle/input"

working:
  cleaned_csv_path: "/kaggle/working/mimic_cxr_cleaned.csv"
