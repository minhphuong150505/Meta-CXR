# Auto-generated encoder comparison config: 04_biovil_pubmedclip
model:
  arch: blip2
  model_type: pretrain
  load_pretrained: False
  freeze_vit: True
  vit_model: biovil
  vit_model_cls: [pubmedclip]
  encoders:
    biovil: true
    pubmedclip: true
    swin: false
  num_query_token: 32
