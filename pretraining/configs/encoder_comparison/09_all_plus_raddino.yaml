# Encoder comparison config: 09_all_plus_raddino
# biovil + pubmedclip + SwinV2(MIMIC) + rad-dino — strongest CXR feature set
model:
  arch: blip2
  model_type: pretrain
  load_pretrained: False
  freeze_vit: True
  vit_model: biovil
  vit_model_cls: [pubmedclip]
  encoders:
    biovil: true
    pubmedclip: true
    swin: true
    raddino: true
  swin:
    backend: hf
    model_name: "ChayanM/SwinV2-GPT2_Mimic"
    pretrained: true
    frozen: true
    normalize: true
  raddino:
    model_name: "microsoft/rad-dino"
    frozen: true
    normalize: true
  num_query_token: 32
  max_txt_len: 256
  mhcac:
    threshold_path: "threshold.json"

datasets:
  mimic_cxr:
    vis_processor:
      train: {name: "blip2_image_train", image_size: 448}
      eval:  {name: "blip_image_eval",  image_size: 448}
    text_processor:
      train: {name: "my_blip_caption", prompt: ''}
      eval:  {name: "my_blip_caption", prompt: ''}

run:
  task: image_text_pretrain_eval
  project_name: meta-cxr-encoder-comparison
  wandb_entity: phuongnm150505-uit
  run_name: 09_all_plus_raddino

  lr_sched: "linear_warmup_cosine_lr"
  init_lr_cls: 1e-4
  init_lr_q: 1e-4
  init_lr: 1e-4
  min_lr: 2e-6
  warmup_lr: 1e-6

  weight_decay: 0.02
  max_epoch: 15
  early_stop_patience: 5
  early_stop_min_delta: 1e-4
  save_freq: 5
  batch_size_train: 4
  batch_size_eval: 4
  num_workers: 2
  warmup_steps: 1000
  accum_grad_iters: 4

  max_len: 256
  min_len: 8
  num_beams: 1

  seed: 42
  output_dir: "/home/phuong/output/09_all_plus_raddino"

  amp: True
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
