# Auto-generated encoder comparison config: 07_all_three
model:
  arch: blip2
  model_type: pretrain
  load_pretrained: False
  freeze_vit: True
  vit_model: biovil
  vit_model_cls: [pubmedclip]
  encoders:
    biovil: true
    pubmedclip: true
    swin: true
  swin:
    backend: hf
    model_name: "ChayanM/SwinV2-GPT2_Mimic"
    pretrained: true
    frozen: true
    normalize: true
  num_query_token: 32
  max_txt_len: 256
  mhcac:
    threshold_path: "threshold.json"

datasets:
  mimic_cxr:
    vis_processor:
      train: {name: "blip2_image_train", image_size: 448}
      eval:  {name: "blip_image_eval",  image_size: 448}
    text_processor:
      train: {name: "my_blip_caption", prompt: ''}
      eval:  {name: "my_blip_caption", prompt: ''}

run:
  task: image_text_pretrain_eval
  project_name: meta-cxr-encoder-comparison
  wandb_entity: phuongnm150505-uit
  run_name: 07_all_three

  lr_sched: "linear_warmup_cosine_lr"
  # Verbatim from upstream blip2_pretrain_stage1_emb.yaml. Valid only because
  # accum_grad_iters below restores upstream's effective batch of 128.
  init_lr_cls: 2e-4
  init_lr_q: 2e-4
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 5e-5

  weight_decay: 0.02
  max_epoch: 10
  early_stop_patience: 5
  early_stop_min_delta: 1e-4
  save_freq: 5
  batch_size_train: 4
  batch_size_eval: 4
  num_workers: 2
  # 4 samples per micro-batch x 32 = effective batch 128, as upstream.
  # Warmup matched by sample count: upstream 4000 x 32 = 128k -> 32000 x 4.
  warmup_steps: 32000
  accum_grad_iters: 32

  max_len: 256
  min_len: 8
  num_beams: 1

  seed: 42
  output_dir: "/home/phuong/output/07_all_three"

  amp: True
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
