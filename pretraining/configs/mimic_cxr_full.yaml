# Production Stage-1 recipe for full MIMIC-CXR-JPG p10-p19 on one GPU.
# Memory settings below were verified on an RTX 5060 Ti 16 GB. Batch 16 /
# accum 4 is the measured default as of 2026-08-14 -- launch this config
# WITHOUT batch overrides; the old `batch_size_train=6 accum_grad_iters=11`
# command line is superseded.
# The processed CSV paths come from configs/env_config.yaml and must point at
# processed/full_allviews_v2. One epoch is one pass over unique studies (~223k),
# not one pass over the ~365k duplicated image rows.

model:
  arch: blip2
  model_type: pretrain
  load_finetuned: false
  load_pretrained: true
  pretrained: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained.pth"

  freeze_vit: true
  # ⚠ freeze_vit stays TRUE. It is a blunt all-or-nothing switch over BioViL's
  # 29.98M parameters; encoder_finetune below is the selective mechanism and
  # runs AFTER it, so it decides what actually trains.
  #
  # PARTIAL ENCODER FINE-TUNING, ON as of 2026-08-20. Both vision encoders were
  # fully frozen, which is the most likely explanation for the run plateauing:
  # over epochs 5-9 train loss moved 1.856 -> 1.834 while val loss moved
  # 1.8916 -> 1.8902, one twentieth as far. The trainable part had saturated and
  # the part that carries image information could not move at all.
  #
  # DEEPENED 2026-08-21. The shallow release (layer4 + CLIP blocks 10-11,
  # 31.85M) is the only intervention so far that moved the model rather than the
  # operating point: paired bootstrap on test gave AUROC +0.0201
  # [+0.0136, +0.0263] with all four headline metrics significant and AUROC up on
  # 14 of 14 labels, and it lifted the precision ceiling from ~0.40 to ~0.52.
  # Every cheaper lever has since been exhausted and measured: more epochs buy
  # nothing (run_20260821_ext, 7h32m, all CIs cross zero), thresholding is at 97%
  # of its own ceiling, and abstention adds nothing at a per-label operating
  # point because the model's confidence does not identify its own errors
  # (per-label AUROC of a trained error predictor 0.6078 vs 0.6149 for the raw
  # score). So the lever that worked is being pushed further.
  #
  # ~53.1M of 181.3M frozen parameters (+17.6% on the 301.9M already trainable).
  # Backprop now reaches ResNet50's layer3 and CLIP's block 8, so more
  # activations are retained -- VRAM headroom was 44% of the 16 GB card at 8,976
  # MiB, which is what this is spending.
  #
  # ⚠ ONE CHANGE ONLY vs run_20260820_ft. kappa, batch, LR, epochs and every loss
  # weight are untouched, so this run is a clean ablation of unfreeze depth --
  # unlike run_20260820_ft, where kappa and the unfreeze moved together and their
  # contributions could not be separated.
  #
  # ⚠ These names are exact, taken from model.named_parameters() on the built
  # model; a pattern matching nothing RAISES rather than silently unfreezing
  # nothing. Do not include pubmedclip.model.text_model (63.17M) -- this project
  # never runs CLIP's text tower.
  encoder_finetune:
    enabled: true
    patterns:
      - visual_encoder.encoder.encoder.layer3              # ResNet50 stage 3, ~7.1M   NEW
      - visual_encoder.encoder.encoder.layer4              # ResNet50 stage 4, 14.965M
      - visual_encoder.projector                           #                    2.708M
      - pubmedclip.model.vision_model.encoder.layers.8     # CLIP ViT block 8,   7.088M NEW
      - pubmedclip.model.vision_model.encoder.layers.9     # CLIP ViT block 9,   7.088M NEW
      - pubmedclip.model.vision_model.encoder.layers.10    # CLIP ViT block 10,  7.088M
      - pubmedclip.model.vision_model.encoder.layers.11    # CLIP ViT block 11,  7.088M
      - pubmedclip.model.vision_model.post_layernorm       #                    0.002M
    # Frozen-BatchNorm fine-tuning: hold the touched encoders in eval mode for
    # the whole run. ResNet50's BatchNorm would otherwise recompute statistics
    # from batches of 16 mixed anchor/auxiliary views. It also fixes a quieter
    # pre-existing problem -- model.train() puts these encoders in train mode
    # even when frozen, so their running statistics were already drifting.
    keep_batchnorm_eval: true
  vit_model: biovil
  vit_model_cls: [pubmedclip]
  # Must match datasets.mimic_cxr.vis_processor.*.image_size below. It is stated
  # here because the model config inherits image_size: 224 from the upstream
  # BLIP-2 default YAML, and nothing used to read it -- init_vision_encoder
  # ignores it for biovil -- so the wrong value sat here unnoticed. It now
  # determines BioViL's token grid (448/32 -> 14x14 -> 196 tokens).
  image_size: 448
  encoders:
    biovil: true
    pubmedclip: true
    # OFF as of 2026-08-14. This changes the architecture, not just a weight:
    # the shared projector receives two streams instead of three, and MHCAC now
    # sees 246 visual tokens (biovil 196 + pubmedclip 1 CLS + 49). Any
    # checkpoint trained with swin on cannot be loaded against this config, and
    # vice versa -- turning it back on also drops MHCAC to the legacy
    # resample-everything-to-49 path, because _native_stream_layouts cannot
    # describe swin's token count.
    #
    # It was by far the most expensive of the three: ~220 ms of a ~520 ms step
    # and ~1.6 GB. SwinV2 at 448 has 112x112 = 12,544 tokens at its first stage
    # and does window attention over them, against 196 for BioViL's CNN and 49
    # for PubMedCLIP.
    #
    # explanation.streams below still lists swin; that is a filter over the
    # streams actually captured, so a name that is not produced is simply
    # ignored. Re-enabling the encoder therefore needs no second edit.
    #
    # BACK ON as of 2026-08-18, at the user's request. Everything written above
    # still applies and is the price being paid: MHCAC drops to the legacy
    # resample-to-49 path, so PubMedCLIP loses its CLS token -- the one measured
    # to be irreplaceable (cos(CLS, mean patch) = 0.21, against 1.0000 for
    # BioViL's own global output). No checkpoint from the two-stream era loads
    # against this config.
    #
    # OFF AGAIN the same day, at the user's decision, when turning the Q-Former
    # back on made the two mutually exclusive on this card. MEASURED, not
    # projected, on the 5060 Ti with lambda_itc/itm/lm at 0.1:
    #
    #   3 encoders, batch 8  -> OOM in the BACKWARD pass on iteration 1.
    #                           Iteration 0 completed at max mem 11,238 MiB;
    #                           the retained gradient buffers (319M trainable
    #                           params) pushed iteration 1 over 15.32 GiB.
    #   3 encoders, batch 4  -> fits, 11,083 MiB, 0.40 s/it, but 55,688 iters
    #                           per epoch = ~6.2 h, i.e. ~62 h for ten epochs,
    #                           and ITM's hard negatives fall to 3 per
    #                           microbatch. ITM is a contrastive objective; 3
    #                           candidates is not a contrastive problem.
    #
    # So the choice was "swin, or a Q-Former with enough negatives to learn
    # anything". Dropping swin buys all of it back and is not merely a
    # concession: at two streams _native_stream_layouts describes the batch
    # again, so PubMedCLIP keeps its CLS token and each encoder keeps its own
    # scale -- the configuration this repo measured to be the better one.
    swin: false
    raddino: false
  # Inert while encoders.swin is false; kept so re-enabling needs one flag.
  swin:
    backend: hf
    model_name: "ChayanM/SwinV2-GPT2_Mimic"
    pretrained: true
    frozen: true
    normalize: true

  num_query_token: 32
  cross_attention_freq: 2
  max_txt_len: 256

  mhcac:
    # Labels masked out of training AND evaluation entirely, because they cannot
    # be learned under the blank-masking policy. Counted on the source CheXpert
    # export at study level, 2026-08-15:
    #
    #   No Finding   train 74,305 positive / 0 negative / 0 uncertain
    #                val      582 / 0 / 0      test  568 / 0 / 0
    #
    # This is structural, not a data shortage: the labeler sets No Finding to
    # 1.0 when the report describes no abnormality and leaves it blank
    # otherwise -- it never emits 0.0. Every surviving cell is a positive, so
    # the only thing the loss can teach is "always predict positive", with
    # nothing to push back, while one expert token and one classification head
    # are spent learning a constant.
    #
    # ⚠ IT IS NOT FREE. 22.3% of train studies (49,760) carry No Finding as
    # their ONLY label; masking it leaves them with no usable cell, so they stop
    # contributing to the classification loss and to the explanation loss, which
    # needs at least one positive. Studies left with nothing: 50,484 of 227,827.
    # They still feed lambda_mpc and view consistency, which need no labels.
    #
    # The alternative, NOT done here, is to derive No Finding negatives from the
    # presence of any other positive finding. That would keep those 49,760
    # studies and make the label learnable, at the cost of inventing labels the
    # export does not contain. Set this to [] to train it as-is instead.
    # PUT BACK 2026-08-15, at the user's request, now that the mention gate
    # exists. The reasoning is sound and worth recording: only 33.4% of studies
    # have `No Finding` written at all, so "was it mentioned" carries real
    # information, and the 49,760 train studies that carry it as their only
    # label are no longer stranded -- they train the gate across all fourteen
    # cells regardless of what this list says.
    #
    # What it does NOT recover is a learnable Positive/Negative split: among the
    # 74,305 mentioned cells, 74,305 are Positive and none are Negative, in all
    # three splits. The classification head can only learn a constant for it,
    # and it re-enters the per-pathology table at a free F1 of 1.0000. It stays
    # out of the macro through run.include_meta_labels: false.
    #
    # A limitation to state rather than paper over: some of the 148,453
    # not-mentioned studies genuinely are normal and simply were not described
    # that way, so the gate's target for this label is noisy in one direction --
    # missing positives, never spurious ones.
    excluded_labels: []
    # ⚠ excluded_labels applies to the CLASSIFICATION head only. The mention
    # gate below still covers No Finding, and deliberately: "was No Finding
    # mentioned" is "did the radiologist call this study normal", 74,305 vs
    # 148,453 -- a well-posed binary, unlike its P/N split which has no
    # negatives at all.
    #
    # GATE WEIGHTS: w = (n_not_mentioned / n_mentioned) x kappa_gate, kappa 2,
    # capped at 10. kappa 2 makes the gate wrongly silent -- the model hiding a
    # finding the radiologist did write about -- cost twice a gate that speaks
    # up needlessly. The cap is not cosmetic: five labels have raw ratios of
    # 17-157 and applying those unclipped just relocates "always answer the
    # majority class" into the gate. Measured on train, 2026-08-15.
    #
    # ⚠ kappa_gate LOWERED 2 -> 1 on 2026-08-20. Under the study_presence
    # framing the gate carries most of the presence decision, and measured
    # macro precision was 0.2776 with five labels below 0.25. kappa 2 charged a
    # silent gate twice a talkative one on top of inverse-frequency weights
    # that already correct the imbalance; at kappa 1 the two errors cost the
    # same once frequency is accounted for. Three labels stay at the cap
    # because their raw ratio alone exceeds 10.
    gate_class_weights:
      -  1.998   # No Finding                 mentioned  74,305 / not 148,453
      -  9.498   # Enlarged Cardiomediastinum     21,219 / 201,539
      -  2.423   # Cardiomegaly                   65,084 / 157,674
      -  2.921   # Lung Opacity                   56,818 / 165,940
      - 10.000   # Lung Lesion                     8,046 / 214,712  raw 26.69 CAPPED
      -  2.480   # Edema                          64,003 / 158,755
      -  8.910   # Consolidation                  22,479 / 200,279
      -  2.854   # Pneumonia                      57,794 / 164,964
      -  2.959   # Atelectasis                    56,261 / 166,497
      -  3.239   # Pneumothorax                   52,548 / 170,210
      -  1.620   # Pleural Effusion               85,013 / 137,745
      - 10.000   # Pleural Other                   2,802 / 219,956  raw 78.50 CAPPED
      - 10.000   # Fracture                        5,708 / 217,050  raw 38.03 CAPPED
      -  2.251   # Support Devices                68,520 / 154,238
    # WRONG-SILENCE WEIGHTS for the hierarchical mention-conditioned loss.
    # Only read when loss.lambda_mention_conditioned_cls > 0.
    #
    # alpha = n_not_mentioned / n_mentioned per label, capped at 10. Pure class
    # balancing -- NO clinical kappa here, unlike gate_class_weights above which
    # carry kappa 2 on top.
    #
    # Without it the hierarchy charges hiding a finding the radiologist DID
    # write about exactly as much as mentioning one they did not: measured 1.00x,
    # against 4-10x in the gate BCE it replaces. With 79.5% of cells blank, that
    # symmetry makes silence the majority answer.
    #
    # ⚠ This makes `m` no longer a calibrated mention probability: its odds are
    # inflated by alpha, so a raw 0.5 threshold means a true probability of
    # 1/(1+alpha). Recover with logit(p) = logit(m) - log(alpha), or fit the gate
    # threshold on validation. The conditional class term stays unweighted.
    mention_conditioned_pos_weights:
      -  1.998   # No Finding                    74,305 / 148,453
      -  9.498   # Enlarged Cardiomediastinum    21,219 / 201,539
      -  2.423   # Cardiomegaly                  65,084 / 157,674
      -  2.921   # Lung Opacity                  56,818 / 165,940
      - 10.000   # Lung Lesion                    8,046 / 214,712  raw 26.69 CAPPED
      -  2.480   # Edema                         64,003 / 158,755
      -  8.910   # Consolidation                 22,479 / 200,279
      -  2.854   # Pneumonia                     57,794 / 164,964
      -  2.959   # Atelectasis                   56,261 / 166,497
      -  3.239   # Pneumothorax                  52,548 / 170,210
      -  1.620   # Pleural Effusion              85,013 / 137,745
      - 10.000   # Pleural Other                  2,802 / 219,956  raw 78.50 CAPPED
      - 10.000   # Fracture                       5,708 / 217,050  raw 38.03 CAPPED
      -  2.251   # Support Devices               68,520 / 154,238
    # CLASSIFICATION WEIGHTS: [w_negative, w_positive, w_uncertain].
    # w_positive = (n_negative / n_positive) x kappa, capped at 10.
    #
    # The (n_neg/n_pos) part is FULL inverse frequency, not the square root the
    # previous values used. sqrt deliberately under-corrects, and the residual
    # was not small: it left 12 of 14 labels pushing toward Positive, by up to
    # 5.36x for Atelectasis, and the measured specificity tracked it almost
    # monotonically -- Atelectasis 0.000, Support Devices 0.000, Lung Opacity
    # 0.017, against 0.675 for Edema whose ratio was already 1.02. Full inverse
    # frequency brings every label to 1.00 before any clinical preference is
    # applied.
    #
    # kappa is that clinical preference: how much worse a miss is than a false
    # alarm. It is a medical judgement, not a tuning knob, and this table is a
    # PROPOSAL that needs a clinician's sign-off before any published claim.
    #   kappa 4  Pneumothorax
    #   kappa 3  Pneumonia, Edema, Consolidation
    #   kappa 2  Pleural Effusion, Cardiomegaly, Atelectasis, Lung Lesion,
    #            Fracture, Pleural Other
    #   kappa 1  Support Devices, Lung Opacity, Enlarged Cardiomediastinum
    #
    # ⚠ kappa does not create skill. AUROC is fixed at 0.7776; kappa only picks
    # an operating point on that curve, trading specificity for sensitivity.
    # What may actually improve the model here is the gate, which puts the 79.5%
    # blank share of the label matrix to work for the first time.
    #
    # ⚠ EVERY kappa LOWERED TO 1 on 2026-08-20, i.e. pure inverse frequency
    # with no clinical preference on top. Reason: measured macro precision of
    # 0.2776 under study_presence, and the repo's own note above that kappa
    # only picks an operating point rather than creating skill -- while
    # thresholds are calibrated on validation afterwards anyway, which already
    # picks that operating point and does it better. Nothing here is a
    # clinical judgement any more, which also retires the un-signed-off kappa
    # table. Pneumothorax leaves the cap entirely: 4.060 is its raw ratio.
    class_weights:
      - [1.0,  1.000, 1.000]  # No Finding -- excluded from this head entirely
      - [1.0,  0.742, 0.569]  # Enlarged Cardiomediastinum  k=1  (was k=1 0.742)
      - [1.0,  0.358, 2.660]  # Cardiomegaly                k=1  (was k=2 0.716)
      - [1.0,  0.060, 0.803]  # Lung Opacity                k=1  (was k=1 0.060)
      - [1.0,  0.138, 0.755]  # Lung Lesion                 k=1  (was k=2 0.276)
      - [1.0,  0.963, 1.967]  # Edema                       k=1  (was k=3 2.890)
      - [1.0,  0.746, 1.867]  # Consolidation               k=1  (was k=3 2.239)
      - [1.0,  1.485, 1.343]  # Pneumonia                   k=1  (was k=3 4.456)
      - [1.0,  0.034, 0.150]  # Atelectasis                 k=1  (was k=2 0.067)
      - [1.0,  4.060, 10.000] # Pneumothorax                k=1  (was k=4 10.000 CAPPED)
      - [1.0,  0.504, 4.720]  # Pleural Effusion            k=1  (was k=2 1.009)
      - [1.0,  0.065, 0.170]  # Pleural Other               k=1  (was k=2 0.130)
      - [1.0,  0.205, 1.600]  # Fracture                    k=1  (was k=2 0.410)
      - [1.0,  0.053, 10.000] # Support Devices             k=1  (was k=1 0.053)
    distill_temperature: 2.0
    text_dropout: 0.2
    # Ambiguous pairs are not reliable positive/negative targets.
    uncertain_policy: ignore_uncertain
    # Defaults are sqrt inverse-frequency weights derived from the full
    # study-level train split; [] disables weighting for an ablation.
    label_smoothing: 0.05

  # CLASSIFICATION-ONLY RECIPE (2026-08-13). The objective now matches upstream
  # META-CXR (DasithEdirisinghe/META-CXR @ e97d709, blip2_qformer.py:477):
  #     loss = cls + 0.3*contrastive + 0.7*orthogonality + 0.3*sparsity
  # plus the multi-view terms, which upstream has no equivalent of.
  #
  # MEASURED on the training host, 200 iterations at batch 6 (2026-08-13):
  #   0.5251 s/it here, against 0.8196 s/it with lambda_itc/itm/lm at 1.0.
  #   1.56x, i.e. ~5.4 h/epoch instead of ~8.4 h; ~54 h instead of ~84 h over
  #   10 epochs. forward() skips the Q-Former and text-encoder passes outright
  #   when these weights are zero rather than computing and multiplying by zero.
  #
  # ⚠ WHAT THIS CHECKPOINT CAN AND CANNOT DO
  # The Q-Former gets no gradient and stays at its pretrained initialisation, so
  # this checkpoint serves Stage-1 classification ONLY. Stage-2
  # `meta_cxr_qformer` and `meta_cxr_qformer_with_mhcac_prompt` would read
  # untrained soft tokens and are NOT valid against it. Stage-2
  # `medgemma_direct` (the default) is unaffected -- it never touches Stage 1.
  # Tried at 0.1 each on 2026-08-16 and reverted the same day; see below.
  loss:
    # Vision-language objectives. BACK ON 2026-08-16 at 0.1, after being 0.0
    # since 2026-08-13. Turning them on also un-skips two BERT forwards, ITM
    # hard-negative mining and an LM decoder pass in forward().
    #
    # WHY THEY WERE OFF, and it was not the cost: they sat at EXACTLY chance.
    #   train loss_itc 6.9375 = ln(1024) exactly, at queue 1024
    #   val   loss_itc 1.7918 = ln(6)    exactly, at eval batch 6
    #         loss_itm 0.6365
    # That ITM figure is the sharper evidence. The old note here compared it to
    # ln(2) = 0.6931 and called it "near chance". It is not near anything: this
    # implementation builds one positive against two negatives (`:1010-1012`,
    # [pos,pos,neg] text vs [pos,neg,pos] image), and 0.6365 is exactly the
    # entropy of that 1:2 prior -- the optimum for CONSTANT logits. The head had
    # collapsed, not merely failed to converge.
    #
    # WHY RETRY NOW: what the Q-Former reads changed materially since. BioViL is
    # no longer pooled 14x14 -> 7x7 and PubMedCLIP's CLS is no longer deleted, so
    # cross-attention sees 246 native tokens instead of 98 interchangeable coarse
    # ones; PubMedCLIP patches lost a DC direction that was 97% constant (mean
    # pairwise cosine 0.674 -> -0.014); positional encodings init at std=0.02
    # instead of a bare randn that made cos(token+pos, pos) = 0.999 at step 0.
    # Any of those could explain a collapsed contrastive head. None of it is
    # proof it will work now.
    #
    # 0.1 rather than BLIP-2's 1.0: keeps the 1:1:1 balance among the three while
    # making the whole vision-language block auxiliary to lambda_cls: 1.0. The
    # Q-Former's exclusive parameters receive only these gradients, so Adam
    # largely normalises the common scale anyway.
    #
    # COST: measured 0.8196 s/it against 0.5251 with them off, i.e. 1.56x. On the
    # current healthy 0.235 s/it that projects to ~14 h for 10 epochs instead of
    # ~9 h. A projection, not a measurement -- the 1.56x was taken at batch 6
    # before the dataloader was fixed.
    #
    # OFF AGAIN 2026-08-16, same day, at the user's decision: this project needs
    # Stage-1 classification and nothing else, and the Q-Former contributes
    # nothing to it.
    #
    # ⚠ THE Q-FORMER DOES NOT FEED CLASSIFICATION. `shared_visual` goes to MHCAC
    # (`:1226`) and, separately, to the Q-Former (`:1088`); `query_output` reaches
    # ITC, ITM and LM and NEVER reaches MHCAC. Forward-wise the two are parallel
    # branches. But `image_embeds = shared_visual.tokens` is not detached, so with
    # these weights above zero the vision-language gradients DO reshape the shared
    # projector, the stream adapters and the view fusion -- exactly the parameters
    # MHCAC's features come from. A collapsed contrastive head still emits
    # gradient; it is just noise pulling on the classification trunk.
    #
    # WHAT THE 2026-08-16 ATTEMPT MEASURED, so nobody retries blindly:
    #   - OOM on the FIRST iteration at batch 16 (14.90 GiB allocated of 15.45).
    #     ITM triples the batch, so 48 joint sequences over 246 visual tokens.
    #     Batch had to drop to 8, which doubles the iteration count.
    #   - True cost ~36 h for 10 epochs against ~9 h, i.e. 4x, not the 1.56x this
    #     file used to claim -- that figure was taken at batch 6 with 98 tokens.
    #   - loss_itm reached 0.6420 after two epochs, against the 1:2 prior entropy
    #     of 0.6365. The collapse signature reproduced almost immediately.
    #   - scripts/check_itc_gate.py at initialisation: mean rank of the true pair
    #     119.8 / 134.5 against 127.5 at chance. The pretrained BLIP-2 Q-Former
    #     cannot tell a chest radiograph from its own report.
    #
    # Setting these back above zero is a real decision with a real price. Run
    # scripts/check_itc_gate.py before and after ~500 optimizer updates and
    # require delta >= 0.10 nats AND growth. It is the whole reason that script
    # exists.
    #
    # ============================================================ 2026-08-18
    # BACK ON at 0.1, at the user's request: the goal is now to train the WHOLE
    # Stage-1 pipeline, Q-Former included, not classification alone. Everything
    # written above is the price, and none of it has been refuted -- read it as
    # the list of things to watch, not as history.
    #
    # WHAT CHANGED SINCE THE 2026-08-16 ATTEMPT, and what did not:
    #   changed  encoders.swin is back on, so the Q-Former cross-attends over
    #            ~295 shared visual tokens instead of 246, and the privileged-
    #            text teacher adds a second MHCAC forward. Both make the memory
    #            wall NEARER, not further away.
    #   changed  batch 16 -> 8, accum 4 -> 16. Effective batch is 128, not the
    #            64 this recipe used, because 16x4 OOMs with the VL block on and
    #            8x8 has not been measured with three encoders.
    #   unchanged  nothing about the collapse itself. loss_itm reached 0.6420
    #            against the 1:2 prior entropy of 0.6365 within two epochs last
    #            time. The honest expectation is that it reproduces.
    #
    # ⚠ THE GATE RAN, ITC FAILED IT, AND THESE ARE BACK AT 0.0 (2026-08-19).
    # scripts/check_itc_gate.py on val, 256 VALID pairs, chance rank 127.5:
    #
    #   untrained                       rank 130.68 / 130.30   delta -0.0833
    #   525 updates, temp learned       rank 127.43 / 127.65   delta -1.1168
    #   500 updates, temp pinned 0.07   rank 128.38 / 127.45   delta -0.0025
    #
    # Every arm sits on chance; the gate needs delta >= +0.10. A pinned
    # temperature was tried precisely because the learned one had collapsed
    # 0.0249 -> 0.00796, and it changed nothing -- the temperature was a
    # symptom. See model.loss.itc_temp / itc_temp_learnable, which stay in the
    # code and default to the historical learned behaviour.
    #
    # And the reference implementation this fork descends from never trained
    # these at all: in DasithEdirisinghe/META-CXR the whole vision-language
    # block of blip2_qformer.py is commented out, Stage-1's loss is
    # cls + 0.3*contrastive + 0.7*orth + 0.3*sparsity, and its config ships
    # batch_size_train: 2, at which ITC has a chance of ln(2) = 0.69 and
    # teaches nothing. Turning these on was never restoring a working thing.
    #
    # What 0.0 costs, stated plainly: forward() skips the Q-Former's IMAGE path
    # entirely, so query tokens and cross-attention keep their BLIP-2
    # initialisation and this checkpoint is NOT valid for the Stage-2
    # meta_cxr_qformer soft-token modes. The reference is in exactly the same
    # position. The Q-Former's TEXT tower does still train, through
    # lambda_teacher_cls / lambda_distill below, which is also what the
    # reference does -- its MHCAC reads text_embeddings from Qformer.bert.
    #
    # Before setting any of these above zero again, read the gate table above
    # and docs/handoff/PLAN-2026-08-19-itc-temp-probe.md. The one untried idea
    # is the negative queue: it is filled from the LIVE encoder, where MoCo and
    # ALBEF both use a momentum encoder, and the reference has no queue at all.
    lambda_itc: 0.0
    lambda_itm: 0.0
    lambda_lm: 0.0
    lambda_cls: 1.0
    # Privileged-text teacher, BACK ON as of 2026-08-18 at the user's request,
    # restored to the 0.5 / 0.5 it carried before it was switched off.
    #
    # ⚠ WATCH loss_distill ON THE FIRST SCORED EPOCH. The reason this was turned
    # off is that it was measured doing nothing: loss_distill 1.4e-08, with
    # teacher and student logits agreeing to 9 significant figures, while
    # costing an extra MHCAC forward every step. Nothing has been changed since
    # to explain why that would now differ, so the honest expectation is that it
    # reproduces. If loss_distill sits near 1e-8 again, the teacher is not
    # teaching and the extra forward is pure cost -- the bug to find then is why
    # the teacher's privileged text is not moving its logits away from the
    # student's, not the weight on this line.
    lambda_teacher_cls: 0.5
    lambda_distill: 0.5
    # Weights for the three MHCAC auxiliary terms now match the upstream
    # META-CXR reference (DasithEdirisinghe/META-CXR @ e97d709,
    # blip2_qformer.py:477):
    #     loss = cls_loss + contrastive*0.3 + orth*0.7 + sparsity*0.3
    # Orthogonality in particular was 14x weaker here (0.05) than there (0.7);
    # it is what pushes the expert tokens apart, so under-weighting it lets them
    # collapse onto one another.
    lambda_mhcac_contrastive: 0.3
    lambda_orthogonality: 0.7
    lambda_sparsity: 0.3
    # MPC WAS DEAD until 2026-08-16 and this weight is lower because of it.
    # It was computed on raw frozen-encoder output stashed before the only
    # trainable module, so it had zero gradient: 3.9929 / 3.9949 / 3.9941 /
    # 3.9943 across four epochs, a constant carrying 22% of the reported loss
    # value and teaching nothing. A per-encoder residual adapter now sits between
    # the frozen encoder and the stash point, and a SimCLR-style projection head
    # gives the objective its own space.
    #
    # 0.02, not the old 0.1: at the chance-level value of ~4.0 that contributes
    # ~0.08 rather than ~0.40, i.e. ~5% of the loss instead of 22%. The old share
    # was only harmless while the gradient was zero.
    #
    # mpc_warmup_steps ramps it linearly from 0 over roughly one epoch --
    # 13,922 microbatches at batch 16 on the full split. The head starts random,
    # and it pulls on an adapter every other loss also reads. Set 0 to disable.
    #
    # ⚠ The adapter adds INFERENCE-path parameters. Checkpoints from before this
    # change cannot be resumed into it; start a fresh run.
    #
    # NOT YET RUN ON GPU beyond a smoke.
    lambda_mpc: 0.02
    # 13,922 microbatches = one epoch at batch 16 (was 27,844 at batch 8). This
    # counts MICROBATCHES, so it must be rescaled whenever batch_size_train is,
    # or the ramp silently covers half an epoch instead of one. Rescaled back
    # 2026-08-19 with the batch, when the VL block went to 0.0.
    mpc_warmup_steps: 13922
    lambda_view_consistency: 0.05
    # TWO explanation terms, split 2026-08-16 because they are not the same
    # kind of evidence and must not carry the same weight.
    #
    #   lambda_explanation        WEAK. One pooled CAM per study against a
    #     CheXmask LUNG mask. The mask is anatomical and identical for all
    #     fourteen findings, so the only claim it supports is "the model looks
    #     inside the lungs". Covers ~93% of studies.
    #
    #   lambda_explanation_strong STRONG. One CAM per (study, finding) against
    #     an MS-CXR expert BOX drawn around that named finding. The only term
    #     that supports "the model looks at the pathology". Covers 823 train
    #     and 138 test studies.
    #
    # Either being > 0 enables the module; both 0 disables it entirely,
    # including CAM capture. There is deliberately no separate
    # explanation.enabled key that could disagree with these.
    #
    # BOTH ARE 0.0 AS OF 2026-08-17: the term is OFF in production, on measured
    # evidence, by the user's decision. It was 0.05 / 0.25 (0.25 being the alpha
    # Faruqui & Dubey report as the best accuracy/explanation trade-off, Fig. 4,
    # with the weak term held to 0.05 so the plentiful anatomical prior could not
    # drown the scarce expert signal).
    #
    # A controlled 5-epoch A/B on the host, identical seed/manifest/recipe, the
    # two lambdas the only difference (`abl_on` vs `abl_off`), test split with
    # thresholds calibrated on val under ignore_uncertain:
    #
    #                        ON (0.05/0.25)   OFF (0/0)
    #   positive_macro_f1        0.8757        0.8767
    #   macro_auroc              0.7850        0.7879
    #   macro_specificity        0.3840        0.4127
    #   wall clock               5:06:44       4:25:27      (+15.5%)
    #
    # Every 95% CI overlapped and every difference favoured OFF. It also failed
    # at its OWN objective. `L_exp` maximises saliency mass inside the mask,
    # which is exactly what evaluate_explanation.py measures, and the honest
    # baseline for that number is the mask area fraction (test: lung 0.3301,
    # bbox 0.2366) because a random CAM scores precisely that:
    #
    #                        ON        OFF      random
    #   biovil     lung     0.3692    0.3383    0.3301
    #   biovil     bbox     0.2552    0.2533    0.2366
    #   pubmedclip lung     0.3810    0.4085    0.3301
    #   pubmedclip bbox     0.1769    0.2021    0.2366
    #
    # One stream moved +0.031 the right way; the other moved ~0.026 the WRONG
    # way on both populations, and sits BELOW random on bbox. CAMs are at chance
    # in both arms -- including the arm that was never constrained -- so the
    # limit is the representation, not the loss. With the encoders frozen this
    # term can only re-weight channels of a fixed feature map; it cannot teach
    # an encoder to look elsewhere. Revisit only after unfreezing, and fix the
    # blended logging first (blip2_qformer.py logs 0.2*weak + 1.0*strong as one
    # scalar, so neither term is observable on its own).
    lambda_explanation: 0.0
    lambda_explanation_strong: 0.0
    # Mention gate. 0.0 disables it entirely (no gradient reaches the heads,
    # though they are still built so the parameter set is stable).
    lambda_gate: 0.5
    # HIERARCHICAL ALTERNATIVE to (lambda_cls + lambda_gate). OFF by default.
    #
    # The gate and the classifier are two heads that never met: the gate could
    # answer "never mentioned" while the classifier answered "Positive", and
    # nothing reconciled them, because the gate's prediction fed its own BCE and
    # nothing else. It was added to stop the model over-calling findings and it
    # did not work -- measured on the run that finished 2026-08-16, test split,
    # calibrated thresholds, ignore_uncertain:
    #
    #   macro_specificity 0.2637   recall 0.9021 vs precision 0.6835
    #   specificity ~0 on Support Devices (0.000), Fracture (0.000),
    #   Lung Opacity (0.017), Atelectasis (0.100)
    #
    # Setting this > 0 makes them one likelihood instead:
    #
    #   not mentioned      ->  -log(1 - m)
    #   mentioned, class y ->  -log(m) - log(q[y])
    #   P(Neg) = (1-m) + m*q_neg   P(Pos) = m*q_pos   P(Unc) = m*q_unc
    #
    # so silence multiplies the positive down instead of sitting beside it, and
    # `classification_logits` becomes the LOG MARGINAL distribution (softmax of
    # it recovers the marginals, so the evaluator and the saved .npz are
    # unaffected). The raw heads stay available as
    # `conditional_classification_logits` and `mention_logits`.
    #
    # It deliberately carries NO inverse-frequency or clinical-kappa weights:
    # an operating point belongs in the thresholds this project already
    # calibrates on validation after training, not inside the likelihood. That
    # also retires the kappa table that still lacks a clinician's sign-off.
    #
    # Enabling it REQUIRES lambda_cls: 0.0 and lambda_gate: 0.0 -- the
    # constructor raises otherwise rather than let two objectives fight over the
    # same heads.
    #
    # NOT YET RUN ON GPU.
    lambda_mention_conditioned_cls: 0.0
    # 1024 -> 256 on 2026-08-16. The queue did not cause the collapse, but at
    # batch 16 a 1024 queue holds 64 microbatches of increasingly stale
    # embeddings; 256 still supplies plenty of negatives and refreshes every 16.
    itc_queue_size: 256

  view_consistency:
    # Soft/conditional agreement between the fused and anchor-only predictions.
    # `lambda_view_consistency` above still gates the whole term; these two knobs
    # only change its SHAPE.
    #
    # The original form was an unconditional symmetric KL, on the premise that
    # "adding views must not change which abnormalities are predicted". That
    # premise is wrong here: a lateral view exists to show what the frontal
    # cannot, and 55.3% of train studies (121,738 of 220,216) have one. The old
    # term charged the model for using the second view at all.
    #
    # margin: divergence below this is free. Small re-weighting is normal; only
    #   an actual flip should cost. 0.0 restores the old unconditional form.
    # confidence_gate: waive the penalty where fusing made the prediction MORE
    #   confident (lower entropy) than anchor-only. Sharpening is what new
    #   evidence looks like; smearing is what noise looks like. The gate is
    #   detached, so the model cannot minimise the term by gaming the gate.
    #
    # margin 0.05 was WRONG and is corrected to 0.01. The unhinged term averaged
    # 0.0228 / 0.0193 / 0.0164 / 0.0168 over the first four epochs of the
    # 2026-08-15 run, and a smoke at margin 0.05 produced exactly 0.0000 -- the
    # hinge swallowed the whole term. (Strictly, a mean below the margin does not
    # by itself prove a zero loss; only having no un-gated cell above it does.
    # The measured 0.0000 is what settles it.) 0.01 forgives negligible drift
    # while still charging the disagreement tail.
    margin: 0.01
    confidence_gate: true
    gate_tolerance: 0.0

  explanation:
    # INERT as of 2026-08-17: both lambda_explanation* above are 0.0, which
    # disables this whole path including CAM capture. Everything below is kept
    # so the term can be switched back on in one edit; see the lambda comment
    # for why it was turned off. The mask cache and evaluate_explanation.py are
    # unaffected and still usable -- the evaluator is what produced the evidence.
    #
    # COST OF THE TERM WHEN ON: +10.5% wall, +174 MiB for the single pooled
    # version measured below. The two-term (weak + strong) version measured
    # +15.5% over a full 5-epoch run, and +13.5/+17.0/+17.6% on epochs [2]/[3]/[4]
    # where the lambdas were live -- so prefer that figure, not the one below,
    # if this is ever re-enabled in its split form.
    #
    # Measured 2026-08-15 from a real 10-epoch run at batch 16, which is the
    # only way to get this right: the warmup below holds lambda at 0 through
    # epoch [1] and ramps from [2], so consecutive epochs of the same run differ
    # in nothing else. Per-epoch wall clock over 13,922 iterations:
    #
    #   epoch [1]  lambda 0       0.2118 s/it
    #   epoch [2]  lambda 0.125   0.2352 s/it
    #   epoch [3]  lambda 0.1875  0.2350 s/it
    #   epoch [4]  lambda 0.25    0.2340 s/it
    #
    # Note [2] through [4] are flat while lambda doubles: the cost is switched,
    # not scaled. Grad-CAM runs in full whenever lambda > 0, so a smaller alpha
    # buys nothing in time -- only warmup_start_epoch does.
    #
    # It stays this cheap because the Grad-CAM backward only traverses the
    # MHCAC subgraph, not the frozen encoders, and the term fires on 56.7% of
    # studies (a study needs both a mask and a positive finding).
    #
    # Two earlier figures here were wrong and are recorded so nobody re-derives
    # them: "+3.6%" was measured with three encoders, when a 0.56 s step hid
    # Grad-CAM inside it; "+15.0%" was measured while the dataloader was the
    # bottleneck and so mostly measured the dataloader. Both are superseded by
    # the table above. The +174 MiB was never affected.
    #
    # At batch 16 with the fixed data path a 10-epoch run is ~9.0 h wall
    # (measured: epochs average 55 min with this term on, 49 min without).
    # top_k = fraction of CAM mass held to the mask. The weak lung mask is a
    # broad anatomical prior, so it constrains only the most salient activation
    # (0.2); the strong box is specific and constrains half the mass (0.5).
    top_k: 0.2            # weak / pooled, CheXmask lung
    strong_top_k: 0.5     # strong / per-pathology, MS-CXR box
    # Epoch indices [0]-[1] are zero; [2]-[3] ramp; [4]+ use the full weight.
    warmup_start_epoch: 2
    warmup_epochs: 2
    streams: [biovil, pubmedclip, swin]
    # Private MIMIC-derived cache built by preporcessing/build_explanation_masks.py.
    # Built 2026-08-14: 208,987 train / 1,690 val / 2,959 test masks.
    # Empty disables the whole path (no mask keys, no memmap, unchanged image
    # transforms) and is the way to run the without-explanation control.
    mask_cache_dir: "/mnt/drive1tb/datasets/explanation_masks"

  multi_view: true
  view_fusion:
    num_heads: 8
    ffn_ratio: 4
    num_blocks: 1
    num_view_types: 4
    dropout: 0.1
    p_view_drop: 0.15
  data:
    study_sampling: true
    anchor_priority: [PA, AP, lateral]
    max_aux_views: 1

datasets:
  mimic_cxr:
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 448
        resize_size: 512
        augmentation:
          enabled: true
          degrees: 5.0
          translate: 0.02
          scale_delta: 0.05
          affine_p: 0.5
          jitter_p: 0.5
          brightness: 0.1
          contrast: 0.1
      eval:
        name: "blip_image_eval"
        image_size: 448
        resize_size: 512
    text_processor:
      train: {name: "my_blip_caption", prompt: ""}
      eval: {name: "my_blip_caption", prompt: ""}

run:
  task: image_text_pretrain_eval
  project_name: meta-cxr-full
  wandb_entity: ""
  run_name: mimic_cxr_full_blip2

  lr_sched: linear_warmup_cosine_lr
  init_lr: 1.0e-4
  init_lr_q: 1.0e-4
  init_lr_cls: 1.0e-4
  # Pretrained encoder slices released by model.encoder_finetune, 10x below the
  # heads. They are the only parameters in this run that already encode
  # something worth keeping; at 1.0e-4 they would be overwritten in the first
  # few hundred steps and fine-tuning would be strictly worse than freezing.
  # Without this key they fall back to init_lr, which is exactly that failure.
  init_lr_enc: 1.0e-5
  # RAISED 2026-08-18 from 1.0e-5, at the user's request: the late epochs were
  # improving too slowly. The cosine floor is what the tail of the run actually
  # trains at, so this knob moves the end without disturbing the start. Measured
  # over the shipped schedule (10 epochs, ~3,480 optimizer updates per epoch at
  # effective batch 64, 800 warmup updates), the LR at each epoch boundary
  # changes by:
  #   [1] 1.00x  [2] 1.01x  [3] 1.02x  [4] 1.05x  [5] 1.08x
  #   [6] 1.15x  [7] 1.27x  [8] 1.47x  [9] 1.79x  end 2.00x
  # i.e. epochs [0]-[4] are untouched for practical purposes and only the last
  # three move, which is the point. Absolute values at the tail: epoch [8] now
  # starts at 2.80e-5 instead of 1.90e-5, epoch [9] at 2.21e-5 instead of
  # 1.23e-5, and the run ends at 2.0e-5 instead of 1.0e-5.
  #
  # The scheduler is stateless -- lr is recomputed from (epoch, step) every
  # update and nothing about it is persisted -- so a resume from checkpoint_last
  # picks this up immediately, with the optimizer moments intact.
  #
  # Was 1.0e-5, which matched the upstream META-CXR reference; before that
  # 1.0e-6, which decayed the tail 10x further than the recipe this work
  # derives from. NOT YET RUN ON GPU at this value.
  min_lr: 2.0e-5
  warmup_lr: 1.0e-6
  # Optimizer updates, NOT microbatches -- this differs from upstream, which
  # steps its scheduler once per microbatch. Converting: upstream's 4000
  # microbatches at accum_grad_iters 4 is 1000 optimizer updates. 800 is close to
  # that without going over, and is ~2.3% of a 10-epoch run here (~3,440 updates
  # per epoch at effective batch 64), against 0.9% at the previous 300.
  warmup_steps: 800
  weight_decay: 0.02
  max_grad_norm: 1.0

  max_epoch: 10
  # Epoch INDEX of the first scored epoch, matching the training log: epoch [5]
  # is the sixth. Epochs [0]-[4] train but are not evaluated, which saves one
  # full validation pass each. The same knob gates checkpoint_best, so the
  # selected checkpoint can never come from an unscored epoch.
  eval_start_epoch: 5
  # Stop after this many SCORED epochs without meaningful AUPRC improvement.
  # The patience window opens at eval_start_epoch: epochs [0]-[4] are unscored
  # and do not consume it, so the earliest possible stop is epoch
  # eval_start_epoch + early_stop_patience.
  #
  # ARITHMETIC, read before changing max_epoch: 5 + 5 = 10, and the last epoch
  # index in a 10-epoch run is [9]. Early stopping therefore CANNOT fire in this
  # configuration. That is harmless -- the run ends at [9] either way -- but it
  # means the value is currently inert. To make it live, set it to 4 or less.
  early_stop_patience: 5
  early_stop_min_delta: 1.0e-4
  # Select on total validation loss -- the quantity actually optimised, and
  # independent of any decision threshold. ``selection_mode`` is deliberately
  # absent: RunnerBase infers "min" from the metric name containing "loss", and
  # leaving an explicit "max" here would silently keep the worst epoch.
  #
  # KNOWN BIAS, stated so results are read correctly: validation loss is a
  # weighted sum dominated by the frequent labels, so a model that stops
  # predicting a rare finding altogether can score better than one that finds
  # it sometimes. macro_auprc is per-label and threshold-free and does not have
  # that failure mode; it was replaced because val is thin for two labels
  # (Pleural Other 14 positives, Fracture 16), which made its rare-label terms
  # noisy. Both numbers are logged every scored epoch -- compare which epoch
  # each would have chosen before quoting either in a write-up.
  selection_metric: loss
  save_freq: 5
  # Write checkpoint_last this often *within* an epoch. 0 restores the old
  # behaviour of only writing when an epoch finishes.
  #
  # An epoch is ~4 h on this recipe (13,922 iters at 1.0364 s/it, measured
  # 2026-08-18 with three encoders and the teacher on), and checkpoint_last was
  # written only at the end of one. Three separate crashes -- an OOM, a
  # DataLoader deadlock, and a whole-machine hang -- all landed inside epoch 0,
  # so every one of them threw away everything and restarted from step 0. The
  # supervisor could restart the run but had nothing to restart it *from*.
  #
  # 1000 iters is ~17 min of work at the measured rate. The checkpoint is
  # ~3.8 GB (319M trainable params plus two Adam moments) and the write is
  # synchronous, costing a few seconds -- well under 1% overhead.
  #
  # Resume from a mid-epoch checkpoint re-enters the SAME epoch from its first
  # batch: weights and optimizer moments are kept, the position in the data is
  # not. Some studies are therefore seen twice in that epoch. Skipping the
  # consumed batches would mean decoding them again for nothing, which is the
  # cost this is trying to avoid.
  save_every_iters: 1000

  # 16 x accumulation 4 keeps the effective batch at 64.
  #
  # ⚠ THE TABLE BELOW WAS MEASURED WHILE THE DATALOADER WAS THE BOTTLENECK and
  # therefore measures the DATALOADER, not the model. See remap_to_uint8 in
  # ReportDataset.py: it moved ~336 MB of DRAM per image and starved all twelve
  # workers. After fixing it the same loop runs 0.2347 s/it at batch 16 against
  # 0.6346 before -- 2.70x -- and `next(it)` fell from 26.5% of wall to 0.1%.
  # The step is now 94.1% of wall, i.e. genuinely GPU-bound.
  #
  # What survives from the table: the VRAM column, and the fact that batch 32
  # fits comfortably. What does NOT survive: every s/sample figure and the
  # conclusion that "batch size is not a throughput lever" -- that was a
  # property of the old data path. Batch scaling has NOT been re-measured
  # GPU-bound. Do not quote these timings.
  #
  # 16 still stands, but on the modelling argument at the end of this comment,
  # not on speed.
  #
  # MEASURED on the host 2026-08-14, two encoders, explanation loss on, 200
  # iterations each. torch.cuda.max_memory_allocated / nvidia-smi peak:
  #
  #   batch  6 (accum 11)  0.04647 s/sample  3,952 / 4,776 MiB   28.8 h / 10ep
  #   batch 16 (accum  4)  0.04093 s/sample  4,415 / 4,914 MiB   25.3 h / 10ep
  #   batch 24 (accum  3)  0.04016 s/sample  4,889 / 5,532 MiB   24.8 h / 10ep
  #   batch 32 (accum  2)  0.03989 s/sample  5,414 / 6,356 MiB   24.7 h / 10ep
  #
  # The flat s/sample across that table, and the ~37% GPU utilisation that went
  # with it, were both the dataloader ceiling (24.5 studies/s) showing through.
  # `data: 0.0000` in the training log did NOT rule that out: the Python loop
  # runs ahead of CUDA asynchronously, so by the time it calls next() the batch
  # has arrived and the real wait lands in `time:` instead. Measuring the
  # loader on its own -- 0.6520 s/batch against the run's 0.6524 s/it -- is what
  # exposed it. It now delivers 92.9 studies/s against the 68 the GPU consumes.
  #
  # Memory is almost all static: a linear fit over those four points
  # gives 56.2 MiB per sample on top of a 3,615 MiB fixed cost, so 91.5% of the
  # batch-6 footprint is parameters and optimizer state. Even batch 32 uses 39%
  # of the card. The old "batch 8 peaked at 12,755 MB" note was from the
  # three-encoder recipe and no longer applies.
  #
  # 16 is chosen for a modelling reason, not a speed one. lambda_mpc carries
  # ~25% of the total loss, but MultiPositiveContrastiveLoss draws negatives
  # from the live microbatch only, and ~55% of studies have an auxiliary view:
  # at batch 6 that is ~3.3 usable studies, which is not a contrastive problem.
  # 16 gives ~8.8. 32 would give ~17.6 but moves the recipe further than the
  # 2.3 speed points justify.
  # BACK TO 16 on 2026-08-16 once the vision-language objectives went off again.
  # The reduction below was forced by them and by nothing else; with them off the
  # classification-only peak is 4,417 MiB of 15.45 GiB and 16 is the measured best
  # of {6, 16, 24, 32}. The note is kept because the constraint returns the moment
  # anyone sets lambda_itc/itm/lm above zero:
  #
  # 16 -> 8 was forced by re-enabling the vision-language objectives.
  # At batch 16 the run OOMs on the FIRST iteration, inside the Q-Former's
  # cross-attention (Qformer.py:263): 15.45 GiB total, 14.90 GiB allocated,
  # 39.94 MiB free. Classification-only peaked at 4,417 MiB, so the VL block
  # adds ~11 GB. ITM is the driver -- it triples the batch, [pos,pos,neg] text
  # against [pos,neg,pos] image (blip2_qformer.py:1009), so batch 16 pushes 48
  # joint sequences through the Q-Former and text encoder over 246 visual
  # tokens. Batch 8 makes that 24.
  #
  # Gradient checkpointing was considered and REJECTED, not merely skipped:
  # Qformer.py:530 forces use_cache=False whenever it is on, while the
  # image-query pass at blip2_qformer.py:1144 explicitly requests use_cache=True
  # and the LM path consumes those cached query states. Enabling it would break
  # the visual-prefix LM. `model.use_grad_checkpoint` is also the wrong knob --
  # it is routed to the vision encoder (`:214`), which is frozen.
  #
  # Consequences, stated rather than discovered later: the 2026-08-14
  # measurement that made 16 the best of {6, 16, 24, 32} was taken with the VL
  # objectives OFF and no longer decides this. MPC's live negatives halve from
  # 16 to 8, which matters less than it used to now that it has its own
  # projection head at lambda 0.02. ITM still samples only the current
  # microbatch, so it drops to 7 non-self candidates.
  # ============================================================ 2026-08-18
  # 16 -> 8 because lambda_itc/itm/lm went back to 0.1. This is the constraint
  # the note above says returns "the moment anyone sets lambda_itc/itm/lm above
  # zero", and it has now returned. ITM triples the batch -- [pos,pos,neg] text
  # against [pos,neg,pos] image (blip2_qformer.py:1009) -- so batch 8 pushes 24
  # joint sequences through the Q-Former and text encoder, where 16 pushed 48
  # and OOMed on the FIRST iteration at 246 visual tokens. With swin back on
  # there are now ~295, so 16 is further out of reach than it was.
  #
  # ⚠ 8 IS A PROJECTION, NOT A MEASUREMENT. The batch-8 figure that worked came
  # from the two-encoder recipe with the teacher off. Three encoders and the
  # privileged-text teacher both add memory on top. supervise.sh halves the
  # batch and doubles the accumulation on OOM, so a wrong guess here costs one
  # startup (~12 min), not the run.
  #
  # accum 4 -> 8 keeps the effective batch at 64, which is what keeps the LR
  # schedule intact: 222,752 studies / 8 = 27,844 microbatches / 8 = 3,480
  # optimizer updates per epoch, exactly what batch 16 x accum 4 produced. So
  # warmup_steps: 800 and the cosine tail still cover the ground they were set
  # for, and no other run knob needs touching.
  #
  # BACK TO 16 x 4 on 2026-08-19. Batch 8 existed only to fit the VL block,
  # which is now at 0.0, and it cost every loss that draws negatives from the
  # live microbatch half its candidates -- MPC fell from ~8.8 usable multi-view
  # studies to ~4.4. Effective batch is 64 either way, so warmup_steps: 800 and
  # the cosine tail are unchanged: 222,752 / 16 = 13,922 microbatches / 4 =
  # 3,480 optimizer updates per epoch, the same number batch 8 x accum 8 gave.
  # mpc_warmup_steps counts microbatches and was rescaled with it.
  #
  # VRAM is safe by a measured margin, not a guess: 16 x 4 with THREE encoders
  # and the teacher on, VL off, peaked at 9,433 MiB (12,061 by nvidia-smi) on
  # this card. Swin is off now, so this configuration is strictly smaller.
  batch_size_train: 16
  batch_size_eval: 16
  accum_grad_iters: 4
  # The training host has 20 threads and JPEG decode is the dataloader's cost:
  # at 4 workers they sit at 96-98% CPU in state R while the GPU idles between
  # kernels. Measured at batch 6 over 500 iterations: 0.305 s/it at 4 workers
  # against 0.253 at 12, i.e. ~26 h for ten epochs instead of ~31.
  #
  # Not an I/O problem -- a page-cached epoch runs 0.2529 s/it, the same as a
  # cold one, and the mount reads 216 MB/s against the ~50 MB/s this needs.
  # Raising this further has not been measured.
  num_workers: 8

  max_len: 256
  min_len: 8
  num_beams: 1
  seed: 42
  output_dir: "pretraining/outputs"

  # RTX 5060 Ti supports BF16. It retains FP32-like exponent range and avoids
  # GradScaler collapse while keeping mixed-precision memory/throughput gains.
  amp: true
  amp_dtype: bfloat16
  evaluate: false
  train_splits: [train]
  valid_splits: [val]
  # Held out by RunnerBase and evaluated once from checkpoint_best after train.
  test_splits: [test]
  save_text_predictions: false
  # Enables offline per-pathology threshold calibration without another GPU pass.
  save_predictions: true
  uncertain_policy: ignore_uncertain
  include_meta_labels: false

  device: cuda
  world_size: 1
  distributed: false
  # Required whenever RANK/WORLD_SIZE are in the environment, which
  # torch.distributed.run always sets: dist_utils.init_distributed_mode reads
  # run.dist_url unconditionally on that path. Its absence is why launching this
  # config through torchrun died with "Missing key dist_url". Both sibling
  # configs have always carried it.
  dist_url: "env://"
  find_unused_parameters: false
  use_dist_eval_sampler: false
