# Production Stage-1 recipe for full MIMIC-CXR-JPG p10-p19 on one GPU.
# Memory settings below were verified on an RTX 5060 Ti 16 GB. The completed
# 10-epoch run overrode them on the command line with
#   run.batch_size_train=6 run.batch_size_eval=6 run.accum_grad_iters=11
# The processed CSV paths come from configs/env_config.yaml and must point at
# processed/full_allviews_v2. One epoch is one pass over unique studies (~223k),
# not one pass over the ~365k duplicated image rows.

model:
  arch: blip2
  model_type: pretrain
  load_finetuned: false
  load_pretrained: true
  pretrained: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained.pth"

  freeze_vit: true
  vit_model: biovil
  vit_model_cls: [pubmedclip]
  # Must match datasets.mimic_cxr.vis_processor.*.image_size below. It is stated
  # here because the model config inherits image_size: 224 from the upstream
  # BLIP-2 default YAML, and nothing used to read it -- init_vision_encoder
  # ignores it for biovil -- so the wrong value sat here unnoticed. It now
  # determines BioViL's token grid (448/32 -> 14x14 -> 196 tokens).
  image_size: 448
  encoders:
    biovil: true
    pubmedclip: true
    # OFF as of 2026-08-14. This changes the architecture, not just a weight:
    # the shared projector receives two streams instead of three and MHCAC sees
    # 98 visual tokens instead of 147. Any checkpoint trained with swin on
    # cannot be loaded against this config, and vice versa.
    #
    # explanation.streams below still lists swin; that is a filter over the
    # streams actually captured, so a name that is not produced is simply
    # ignored. Re-enabling the encoder therefore needs no second edit.
    swin: false
    raddino: false
  # Inert while encoders.swin is false; kept so re-enabling needs one flag.
  swin:
    backend: hf
    model_name: "ChayanM/SwinV2-GPT2_Mimic"
    pretrained: true
    frozen: true
    normalize: true

  num_query_token: 32
  cross_attention_freq: 2
  max_txt_len: 256

  mhcac:
    distill_temperature: 2.0
    text_dropout: 0.2
    # Ambiguous pairs are not reliable positive/negative targets.
    uncertain_policy: ignore_uncertain
    # Defaults are sqrt inverse-frequency weights derived from the full
    # study-level train split; [] disables weighting for an ablation.
    label_smoothing: 0.05

  # CLASSIFICATION-ONLY RECIPE (2026-08-13). The objective now matches upstream
  # META-CXR (DasithEdirisinghe/META-CXR @ e97d709, blip2_qformer.py:477):
  #     loss = cls + 0.3*contrastive + 0.7*orthogonality + 0.3*sparsity
  # plus the multi-view terms, which upstream has no equivalent of.
  #
  # MEASURED on the training host, 200 iterations at batch 6 (2026-08-13):
  #   0.5251 s/it here, against 0.8196 s/it with lambda_itc/itm/lm at 1.0.
  #   1.56x, i.e. ~5.4 h/epoch instead of ~8.4 h; ~54 h instead of ~84 h over
  #   10 epochs. forward() skips the Q-Former and text-encoder passes outright
  #   when these weights are zero rather than computing and multiplying by zero.
  #
  # ⚠ WHAT THIS CHECKPOINT CAN AND CANNOT DO
  # The Q-Former gets no gradient and stays at its pretrained initialisation, so
  # this checkpoint serves Stage-1 classification ONLY. Stage-2
  # `meta_cxr_qformer` and `meta_cxr_qformer_with_mhcac_prompt` would read
  # untrained soft tokens and are NOT valid against it. Stage-2
  # `medgemma_direct` (the default) is unaffected -- it never touches Stage 1.
  # To restore the vision-language path, set lambda_itc/itm/lm back to 1.0.
  loss:
    # Vision-language objectives, off. Measured at exactly chance before being
    # disabled: val loss_itc 1.7918 = ln(6) at eval batch 6, train 6.9375 =
    # ln(1024) at queue 1024, loss_itm 0.6365 against ln(2) = 0.6931. They were
    # contributing gradient noise, not signal.
    lambda_itc: 0.0
    lambda_itm: 0.0
    lambda_lm: 0.0
    lambda_cls: 1.0
    # Privileged-text teacher, off. Measured loss_distill 1.4e-08 with teacher
    # and student logits agreeing to 9 significant figures -- the teacher was
    # not teaching anything while costing an extra MHCAC forward per step.
    lambda_teacher_cls: 0.0
    lambda_distill: 0.0
    # Weights for the three MHCAC auxiliary terms now match the upstream
    # META-CXR reference (DasithEdirisinghe/META-CXR @ e97d709,
    # blip2_qformer.py:477):
    #     loss = cls_loss + contrastive*0.3 + orth*0.7 + sparsity*0.3
    # Orthogonality in particular was 14x weaker here (0.05) than there (0.7);
    # it is what pushes the expert tokens apart, so under-weighting it lets them
    # collapse onto one another.
    lambda_mhcac_contrastive: 0.3
    lambda_orthogonality: 0.7
    lambda_sparsity: 0.3
    lambda_mpc: 0.1
    lambda_view_consistency: 0.05
    # The loss weight is the sole enable/disable gate.  There is deliberately no
    # separate explanation.enabled key that could disagree with this value.
    #
    # ON as of 2026-08-14, once the cache existed and the cost was measured.
    # alpha = 0.25 is the value Faruqui & Dubey report as the best accuracy /
    # explanation trade-off (Fig. 4). Warmup below keeps it at 0 for epochs
    # [0]-[1] so the classification head settles first.
    lambda_explanation: 0.25
    # Only read when lambda_itc > 0; inert under the classification-only recipe.
    # Kept so re-enabling ITC does not also require rediscovering this value.
    itc_queue_size: 1024

  explanation:
    # MEASURED on the host, 200 iterations at batch 6, RTX 5060 Ti, torch 2.9.1
    # (2026-08-14).
    #
    # Cost of the term itself, three encoders and the slow CLIP processor,
    # everything else identical:
    #   s/it 0.560 -> 0.580 (+3.6%), peak VRAM 6112 -> 6136 MiB
    # +3.6%, not the 30-50% first estimated: the Grad-CAM backward only
    # traverses the MHCAC subgraph, not the frozen encoders, and the term fires
    # on 56.7% of studies (a study needs both a mask and a positive finding).
    #
    # Current recipe, Swin off and CLIPImageProcessorFast, term still on:
    #   s/it 0.305, peak VRAM 4518 MiB (28% of 16 GB), loss_explanation 0.4461
    # 1.90x faster than the three-encoder measurement above. Swin was the bulk
    # of it (~220 ms/step); the CPU-side CLIP resize was ~55 ms.
    #
    # A 10-epoch run is therefore ~31 h, not the ~60 h estimated before those
    # two changes (222,758 studies / batch 6 = 37,126 it/epoch).
    top_k: 0.5
    # Epoch indices [0]-[1] are zero; [2]-[3] ramp; [4]+ use the full weight.
    warmup_start_epoch: 2
    warmup_epochs: 2
    streams: [biovil, pubmedclip, swin]
    # Private MIMIC-derived cache built by preporcessing/build_explanation_masks.py.
    # Built 2026-08-14: 208,987 train / 1,690 val / 2,959 test masks.
    # Empty disables the whole path (no mask keys, no memmap, unchanged image
    # transforms) and is the way to run the without-explanation control.
    mask_cache_dir: "/mnt/drive1tb/datasets/explanation_masks"

  multi_view: true
  view_fusion:
    num_heads: 8
    ffn_ratio: 4
    num_blocks: 1
    num_view_types: 4
    dropout: 0.1
    p_view_drop: 0.15
  data:
    study_sampling: true
    anchor_priority: [PA, AP, lateral]
    max_aux_views: 1

datasets:
  mimic_cxr:
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 448
        resize_size: 512
        augmentation:
          enabled: true
          degrees: 5.0
          translate: 0.02
          scale_delta: 0.05
          affine_p: 0.5
          jitter_p: 0.5
          brightness: 0.1
          contrast: 0.1
      eval:
        name: "blip_image_eval"
        image_size: 448
        resize_size: 512
    text_processor:
      train: {name: "my_blip_caption", prompt: ""}
      eval: {name: "my_blip_caption", prompt: ""}

run:
  task: image_text_pretrain_eval
  project_name: meta-cxr-full
  wandb_entity: ""
  run_name: mimic_cxr_full_blip2

  lr_sched: linear_warmup_cosine_lr
  init_lr: 1.0e-4
  init_lr_q: 1.0e-4
  init_lr_cls: 1.0e-4
  # Matches the upstream META-CXR reference. Was 1.0e-6, which decayed the tail
  # of the run 10x further than the recipe this work derives from.
  min_lr: 1.0e-5
  warmup_lr: 1.0e-6
  # Optimizer updates, NOT microbatches -- this differs from upstream, which
  # steps its scheduler once per microbatch. Converting: upstream's 4000
  # microbatches at accum_grad_iters 4 is 1000 optimizer updates. 800 is close to
  # that without going over, and is ~2.3% of a 10-epoch run here (~3,440 updates
  # per epoch at effective batch 64), against 0.9% at the previous 300.
  warmup_steps: 800
  weight_decay: 0.02
  max_grad_norm: 1.0

  max_epoch: 10
  # Epoch INDEX of the first scored epoch, matching the training log: epoch [5]
  # is the sixth. Epochs [0]-[4] train but are not evaluated, which saves one
  # full validation pass each. The same knob gates checkpoint_best, so the
  # selected checkpoint can never come from an unscored epoch.
  eval_start_epoch: 5
  # Stop after this many SCORED epochs without meaningful AUPRC improvement.
  # The patience window opens at eval_start_epoch: epochs [0]-[4] are unscored
  # and do not consume it, so the earliest possible stop is epoch
  # eval_start_epoch + early_stop_patience.
  #
  # ARITHMETIC, read before changing max_epoch: 5 + 5 = 10, and the last epoch
  # index in a 10-epoch run is [9]. Early stopping therefore CANNOT fire in this
  # configuration. That is harmless -- the run ends at [9] either way -- but it
  # means the value is currently inert. To make it live, set it to 4 or less.
  early_stop_patience: 5
  early_stop_min_delta: 1.0e-4
  # Select on total validation loss -- the quantity actually optimised, and
  # independent of any decision threshold. ``selection_mode`` is deliberately
  # absent: RunnerBase infers "min" from the metric name containing "loss", and
  # leaving an explicit "max" here would silently keep the worst epoch.
  #
  # KNOWN BIAS, stated so results are read correctly: validation loss is a
  # weighted sum dominated by the frequent labels, so a model that stops
  # predicting a rare finding altogether can score better than one that finds
  # it sometimes. macro_auprc is per-label and threshold-free and does not have
  # that failure mode; it was replaced because val is thin for two labels
  # (Pleural Other 14 positives, Fracture 16), which made its rare-label terms
  # noisy. Both numbers are logged every scored epoch -- compare which epoch
  # each would have chosen before quoting either in a write-up.
  selection_metric: loss
  save_freq: 5

  # Verified on RTX 5060 Ti 16 GB: batch 8 peaked at 12,755 MB for the full
  # three-encoder, multi-view forward/backward. 8 x accumulation 8 keeps the
  # effective batch at 64. Contrastive negatives come from
  # the live microbatch plus the queue, not from gradient accumulation.
  batch_size_train: 8
  batch_size_eval: 8
  accum_grad_iters: 8
  # The training host has 20 threads and JPEG decode is the dataloader's cost:
  # at 4 workers they sit at 96-98% CPU in state R while the GPU idles between
  # kernels. Measured at batch 6 over 500 iterations: 0.305 s/it at 4 workers
  # against 0.253 at 12, i.e. ~26 h for ten epochs instead of ~31.
  #
  # Not an I/O problem -- a page-cached epoch runs 0.2529 s/it, the same as a
  # cold one, and the mount reads 216 MB/s against the ~50 MB/s this needs.
  # Raising this further has not been measured.
  num_workers: 12

  max_len: 256
  min_len: 8
  num_beams: 1
  seed: 42
  output_dir: "pretraining/outputs"

  # RTX 5060 Ti supports BF16. It retains FP32-like exponent range and avoids
  # GradScaler collapse while keeping mixed-precision memory/throughput gains.
  amp: true
  amp_dtype: bfloat16
  evaluate: false
  train_splits: [train]
  valid_splits: [val]
  # Held out by RunnerBase and evaluated once from checkpoint_best after train.
  test_splits: [test]
  save_text_predictions: false
  # Enables offline per-pathology threshold calibration without another GPU pass.
  save_predictions: true
  uncertain_policy: ignore_uncertain
  include_meta_labels: false

  device: cuda
  world_size: 1
  distributed: false
  # Required whenever RANK/WORLD_SIZE are in the environment, which
  # torch.distributed.run always sets: dist_utils.init_distributed_mode reads
  # run.dist_url unconditionally on that path. Its absence is why launching this
  # config through torchrun died with "Missing key dist_url". Both sibling
  # configs have always carried it.
  dist_url: "env://"
  find_unused_parameters: false
  use_dist_eval_sampler: false
